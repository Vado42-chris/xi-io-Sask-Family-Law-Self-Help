name: Foundation check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      # pull_request jobs check out a merge commit; validate proof against the PR head.
      SFL_PROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run foundation and architecture checks
        run: npm run check

  browser-proof:
    runs-on: ubuntu-latest
    needs: foundation
    env:
      SFL_PROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npm run playwright:install
      - name: Run browser proof and screenshot head gate
        run: npm run check:browser-proof
      - name: Upload /app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: test-results/screenshots/
